description: |
  DAC sink node for zstreamer pipeline.

  Receives buffers of interleaved samples and writes each frame to the
  configured DAC channel(s) using Zephyr's portable DAC API.

  Single-channel example (12-bit DAC on channel 0):

    dac_sinker: dac-sinker {
        compatible = "zstreamer,dac-sink";
        dac-device = <&dac1>;
        dac-channel-ids = <0>;
        dac-resolution = <12>;
    };

  Multi-channel example (stereo 12-bit DAC):

    dac_sinker: dac-sinker {
        compatible = "zstreamer,dac-sink";
        dac-device = <&dac1>;
        dac-channel-ids = <0 1>;
        dac-resolution = <12>;
    };

compatible: "zstreamer,dac-sink"

include: zstreamer,sink.yaml

properties:
  dac-device:
    type: phandle
    required: true
    description: DAC device to output samples to.

  dac-channel-ids:
    type: array
    required: true
    description: |
      DAC channel number(s).  For multi-channel output, samples in
      the buffer are interleaved across channels (one sample per
      channel per frame).

  dac-resolution:
    type: int
    default: 12
    description: DAC output resolution in bits (shared by all channels).
