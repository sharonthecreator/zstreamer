description: |
  Base binding for zstreamer streaming node devices.
  All zstreamer node driver bindings should include this file
  (via one of the type-specific intermediaries: src, sink,
  or filter) or directly for through-nodes.

compatible: "zstreamer,node"

include: base.yaml

properties:
  thread-stack-size:
    type: int
    default: 1024
    description: Stack size in bytes for the node thread.

  thread-priority:
    type: int
    default: 5
    description: Priority of the node thread.

  children:
    type: phandles
    description: |
      Downstream node(s) that this node sends buffers to.
      For fan-out, list multiple phandles.
      Optional — sinks and leaf nodes omit this property.
