description: |
  Base binding for zstreamer node streaming node devices.
  All zstreamer node driver bindings should include this file.

compatible: "zstreamer,node"

include: base.yaml

properties:
  children:
    type: phandles
    description: |
      Downstream node(s) that this node sends buffers to.
      For fan-out, list multiple phandles.

  thread-stack-size:
    type: int
    default: 1024
    description: Stack size in bytes for the node thread.

  thread-priority:
    type: int
    default: 5
    description: Priority of the node thread.
