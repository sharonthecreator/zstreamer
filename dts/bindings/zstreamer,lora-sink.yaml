description: |
  LoRa sink node. Transmits each received buffer as a LoRa packet using
  the Zephyr LoRa driver API with blocking lora_send().

compatible: "zstreamer,lora-sink"

include: zstreamer,sink.yaml

properties:
  lora-device:
    type: phandle
    required: true
    description: |
      Reference to the LoRa radio device node (e.g., &lora).
  frequency:
    type: int
    default: 865100000
    description: |
      LoRa carrier frequency in Hz (e.g., 865100000 for 865.1 MHz).
  bandwidth:
    type: int
    default: 0
    description: |
      Signal bandwidth enum value from Zephyr lora_signal_bandwidth.
      Common values: 10 = 10.42 kHz, 125 = 125 kHz, 250 = 250 kHz, 500 = 500 kHz.
  spreading-factor:
    type: int
    default: 10
    description: |
      Spreading factor (6-12). Higher values increase range but reduce data rate.
  coding-rate:
    type: int
    default: 1
    description: |
      Coding rate: 1 = 4/5, 2 = 4/6, 3 = 4/7, 4 = 4/8.
  preamble-length:
    type: int
    default: 8
    description: |
      Preamble length in symbols.
  tx-power:
    type: int
    default: 14
    description: |
      Transmit power in dBm.
  switch-gpios:
    type: phandle-array
    description: |
      Optional GPIO spec for a 2-position frequency-select switch, read once
      at first configure. When set, overrides frequency with frequency-low
      (pin reads 0) or frequency-high (pin reads 1). Omit to use frequency
      unconditionally (backward-compatible default).
  frequency-low:
    type: int
    description: |
      Carrier frequency in Hz when switch-gpios reads 0. Only meaningful
      with switch-gpios set; defaults to frequency if unset.
  frequency-high:
    type: int
    description: |
      Carrier frequency in Hz when switch-gpios reads 1. Only meaningful
      with switch-gpios set; defaults to frequency if unset.
