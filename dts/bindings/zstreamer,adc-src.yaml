description: |
  ADC source node for zstreamer pipeline.

  Captures ADC samples using DMA with timer-triggered sampling for precise
  sample rates. Supports 1 or 2 channels (mono/stereo audio capture).

  The trigger-timer property specifies a timer that generates TRGO events
  at the desired sample rate. The ADC is configured to start conversion
  on each timer trigger, and DMA transfers samples to a circular buffer.

  Example for STM32U5 at 48kHz stereo:

    adc_source: adc-source {
        compatible = "zstreamer,adc-src";
        io-channels = <&adc1 0>, <&adc1 1>;
        sample-rate-hz = <48000>;
        resolution = <12>;
        trigger-timer = <&timers6>;
        buffer-samples = <256>;
        children = <&some_sink>;
    };

compatible: "zstreamer,adc-src"

include: zstreamer,src.yaml

properties:
  io-channels:
    type: phandle-array
    required: true
    description: |
      ADC channel(s) to sample. Specify 1 channel for mono or 2 for stereo.
      Each entry is a phandle to an ADC device and channel number.

  sample-rate-hz:
    type: int
    required: true
    description: |
      Desired sampling rate in Hz. Common audio rates: 8000, 16000, 22050,
      44100, 48000, 96000. The actual rate depends on timer configuration
      accuracy.

  resolution:
    type: int
    default: 12
    description: |
      ADC resolution in bits. Supported values depend on the ADC hardware.
      Common values: 8, 10, 12, 14, 16. Default is 12 bits.
    enum:
      - 6
      - 8
      - 10
      - 12
      - 14
      - 16

  trigger-timer:
    type: phandle
    required: true
    description: |
      Timer device used to trigger ADC conversions. The timer's TRGO output
      is connected to the ADC external trigger input. The timer is configured
      to generate triggers at the specified sample-rate-hz.

  buffer-samples:
    type: int
    default: 256
    description: |
      Number of samples per streaming buffer. For stereo, this is the number
      of sample pairs. Larger buffers reduce overhead but increase latency.
      Must be a power of 2 for efficient DMA circular buffer operation.

  dma-buffer-samples:
    type: int
    default: 512
    description: |
      Total samples in the DMA circular buffer. Should be 2x buffer-samples
      for ping-pong operation. The driver uses half-transfer and complete
      interrupts to submit buffers to the streaming pipeline.
