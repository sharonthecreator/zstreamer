description: |
  ADC source node for zstreamer pipeline.

  Captures ADC samples using Zephyr's portable ADC API (blocking reads
  in the source thread).  Supports any number of channels via the
  io-channels property.  Resolution and gain are taken from the ADC
  channel's own DTS properties (zephyr,resolution, zephyr,gain, etc.).

  Example for dual-channel at 1 kHz:

    adc_source: adc-source {
        compatible = "zstreamer,adc-src";
        io-channels = <&adc1 0>, <&adc1 1>;
        sample-rate-hz = <1000>;
        samples = <64>;
        children = <&some_sink>;
    };

compatible: "zstreamer,adc-src"

include: zstreamer,src.yaml

properties:
  io-channels:
    type: phandle-array
    required: true
    description: |
      ADC channel(s) to sample.  Each entry is a phandle to an ADC
      controller and channel number.

  sample-rate-hz:
    type: int
    required: true
    description: |
      Target sampling rate in Hz.  The driver sleeps between read
      batches to approximate this rate; the actual rate depends on
      ADC conversion time.

  samples:
    type: int
    default: 64
    description: |
      Number of sample frames per streaming buffer.  Each frame
      contains one sample per channel.  Larger values reduce overhead
      but increase latency.
