description: |
  Button source for zstreamer.

  Emits exactly one empty buffer per button press, routed by press type:
  short presses go to children, long presses (held >= long-press-ms,
  when long-press-ms > 0) go to long-press-children.  Hold detection is
  done by polling the GPIO level inside process().

  Periodic behavior is composed downstream instead of built in — e.g.
  wire long-press-children to a looper-node to turn one long press into
  N paced emissions:

    button_src: button-src {
        compatible = "zstreamer,button-src";
        gpios = <&gpioc 13 GPIO_ACTIVE_HIGH>;
        long-press-ms = <5000>;
        children = <&encode_node>;
        long-press-children = <&burst_looper>;
        autostart;
    };

    burst_looper: burst-looper {
        compatible = "zstreamer,looper-node";
        retransmit-count = <90>;
        delay-ms = <10000>;
        children = <&encode_node>;
    };

compatible: "zstreamer,button-src"

include: zstreamer,src.yaml

properties:
  gpios:
    type: phandle-array
    required: true
    description: GPIO spec for the button input (e.g. user button).

  long-press-ms:
    type: int
    default: 5000
    description: |
      How long (ms) the button must stay held for the press to route to
      long-press-children.  Released before this threshold is a short
      press (routed to children).  0 disables long-press detection
      entirely.

  long-press-children:
    type: phandles
    description: |
      Downstream node(s) for long presses.  Omitted (or empty) means
      long presses are dropped.
