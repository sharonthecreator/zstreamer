description: |
  ADF-based PDM microphone source with hardware CIC decimation.

  Configures the STM32U5 Audio Digital Filter (ADF1) to receive a PDM
  bitstream on ADF1_SDI0, clock the microphone from ADF1_CCK0, and
  decimate with the hardware Sinc4 CIC filter (DFLT0).  GPDMA transfers
  decimated signed int16 PCM samples from the DFLT0 data register into
  the zstreamer pipeline.

  The node must supply two ``clocks`` entries: the ADF1 bus clock and
  the ADF1 kernel clock source.  Pin configuration for ADF1_CCK0 (clock
  output) and ADF1_SDI0 (data input) must be provided via pinctrl.

  Example (Nucleo-U5A5ZJ-Q, Knowles SPK0641HT4H-1)::

    pdm_source: pdm-source {
        compatible = "zstreamer,pdm-src";
        clocks = <&rcc STM32_CLOCK(AHB3, 10)>,
                 <&rcc STM32_SRC_MSIK ADF1_SEL(4)>;
        sample-rate-hz = <16000>;
        pdm-clk-freq-hz = <2000000>;
        pinctrl-0 = <&adf1_cck0_pf3 &adf1_sdi0_pf4>;
        pinctrl-names = "default";
        dmas = <&gpdma1 0 98 (STM32_DMA_PERIPH_RX |
                                STM32_DMA_MEM_16BITS |
                                STM32_DMA_PERIPH_16BITS)>;
        dma-names = "rx";
        children = <&some_filter>;
        autostart;
    };

compatible: "zstreamer,pdm-src"

include:
  - "zstreamer,src.yaml"
  - pinctrl-device.yaml

properties:
  clocks:
    type: phandle-array
    required: true
    description: |
      Two clock entries:
        [0] ADF1 bus clock on AHB3 (e.g. <&rcc STM32_CLOCK(AHB3, 10)>).
        [1] ADF1 kernel clock source (e.g. <&rcc STM32_SRC_MSIK ADF1_SEL(4)>).
      The kernel clock feeds the ADF clock generator which produces the
      PDM bit-clock on CCK0.

  sample-rate-hz:
    type: int
    required: true
    description: |
      Output PCM sample rate in Hz (e.g. 16000).  Must evenly divide
      pdm-clk-freq-hz to produce an integer decimation ratio.

  pdm-clk-freq-hz:
    type: int
    default: 2048000
    description: |
      PDM bit-clock frequency in Hz output on ADF1_CCK0.
      SPK0641HT4H-1 supports 1.0 -- 4.8 MHz.  Default 2.048 MHz
      gives a clean decimation ratio of 128 at 16 kHz PCM output.

  right-channel:
    type: boolean
    description: |
      Capture the right PDM channel (rising-edge data) instead of the
      default left channel (falling-edge data).  Set this when the
      microphone Select pin is tied to VDD.

  dmas:
    type: phandle-array
    required: true
    description: |
      GPDMA channel for ADF1 DFLT0 RX.  Format:
      <&gpdma1 channel request flags>.  The request slot for
      ADF1_FLT0 is 98 (GPDMA1_REQUEST_ADF1_FLT0).

  dma-names:
    type: string-array
    required: true
    description: Must be "rx".

  warmup-buffers:
    type: int
    default: 0
    description: |
      Number of initial half-buffers to silently discard after DMA
      starts.  PDM microphones need a settling period; the first few
      buffers contain transient noise that can trigger false detections
      downstream.  Set to 0 to disable (default).
