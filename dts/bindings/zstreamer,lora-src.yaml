description: |
  LoRa source node. Receives LoRa packets and produces buffers containing
  the received payload bytes. Uses the Zephyr LoRa driver API with
  blocking lora_recv().

  With switch-gpios set, RX is broken off every couple of seconds to re-read
  the switch, since lora_recv() cannot be aborted. Each break drops a packet
  that happens to be mid-air, so expect a few percent loss and rely on
  sender-side retransmits.

compatible: "zstreamer,lora-src"

include: zstreamer,src.yaml

properties:
  lora-device:
    type: phandle
    required: true
    description: |
      Reference to the LoRa radio device node (e.g., &lora).
  frequency:
    type: int
    default: 865100000
    description: |
      LoRa carrier frequency in Hz (e.g., 865100000 for 865.1 MHz).
  bandwidth:
    type: int
    default: 0
    description: |
      Signal bandwidth enum value from Zephyr lora_signal_bandwidth.
      Common values: 10 = 10.42 kHz, 125 = 125 kHz, 250 = 250 kHz, 500 = 500 kHz.
  spreading-factor:
    type: int
    default: 10
    description: |
      Spreading factor (6-12). Higher values increase range but reduce data rate.
  coding-rate:
    type: int
    default: 1
    description: |
      Coding rate: 1 = 4/5, 2 = 4/6, 3 = 4/7, 4 = 4/8.
  preamble-length:
    type: int
    default: 8
    description: |
      Preamble length in symbols.
  tx-power:
    type: int
    default: 14
    description: |
      Transmit power in dBm (used during config, though this is RX).
  switch-gpios:
    type: phandle-array
    description: |
      Optional GPIO spec for a 2-position frequency-select switch, re-read
      every couple of seconds so the band can be changed while running --
      note this makes reception periodic rather than continuous (see the
      node description). When set, overrides frequency with frequency-low
      (pin reads 0) or frequency-high (pin reads 1). Omit to use frequency
      unconditionally (backward-compatible default).
  frequency-low:
    type: int
    description: |
      Carrier frequency in Hz when switch-gpios reads 0. Only meaningful
      with switch-gpios set; defaults to frequency if unset.
  frequency-high:
    type: int
    description: |
      Carrier frequency in Hz when switch-gpios reads 1. Only meaningful
      with switch-gpios set; defaults to frequency if unset.
