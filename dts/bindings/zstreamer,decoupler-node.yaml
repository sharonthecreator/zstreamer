description: |
  Stereo decoupler processor node for zstreamer.

  The node treats each input buffer as left-right-interleaved elements and
  emits separate left and right buffers.  For example, with element-size = <2>,
  a uint16_t input laid out as left, right, left, right becomes one all-left
  buffer sent to left-children and one all-right buffer sent to right-children:

    stereo-decoupler {
      compatible = "zstreamer,decoupler-node";
      element-size = <2>;
      left-children = <&left_sink>;
      right-children = <&right_sink>;
    };

  Buffers that do not contain a whole number of stereo frames are dropped.
  The node holds the input while allocating both output buffers, so the graph's
  buffer-count must be greater than two, in addition to any buffers needed
  elsewhere in the pipeline.

compatible: "zstreamer,decoupler-node"

include:
  - name: zstreamer,node.yaml
    property-blocklist:
      - children

properties:
  element-size:
    type: int
    required: true
    description: Size of one left or right element in bytes.

  left-children:
    type: phandles
    required: true
    description: Downstream node(s) that receive the left-channel buffers.

  right-children:
    type: phandles
    required: true
    description: Downstream node(s) that receive the right-channel buffers.
