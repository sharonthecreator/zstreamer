description: |
  File system sink node. Writes received buffer data to files,
  rotating based on time or size thresholds.

compatible: "zstreamer,fs-sink"

include: zstreamer,sink.yaml

properties:
  mount-path:
    type: string
    required: true
    description: Directory path where files are saved (e.g. "/lfs/data").

  filename-prefix:
    type: string
    default: ""
    description: >
      Prefix inserted before the file index in generated filenames.
      E.g. "data_" produces "data_00000.bin". Empty string by default.

  delta-ms-threshold:
    type: int
    default: 0
    description: Max time in ms before rotating to a new file. 0 = disabled.

  size-threshold:
    type: int
    default: 0
    description: Max bytes per file before rotating. 0 = disabled.

  file-count:
    type: int
    default: 0
    description: Max number of files before wrapping index to 0. 0 = unlimited.

  max-write-size:
    type: int
    default: 0
    description: Max bytes per fs_write call. Large buffers are chunked. 0 = no limit.

  sync-each-buffer:
    type: boolean
    description: >
      fs_sync() after every buffer instead of only on rotation. Without it the
      most recently written file is left open, and on FAT its directory entry
      still reads size 0 until the *next* buffer triggers a rotation -- so a
      reboot or power cut loses it. Set this on sparse streams, where that next
      buffer may be hours away. Costs a directory-sector read plus a couple of
      sector writes per buffer, so leave it off for continuous streams that
      rotate often on their own.
