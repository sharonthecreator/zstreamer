description: |
  File system sink node. Writes received buffer data to files,
  rotating based on time or size thresholds.

compatible: "zstreamer,sink-fs"

include: zstreamer,sink.yaml

properties:
  mount-path:
    type: string
    required: true
    description: Directory path where files are saved (e.g. "/lfs/data").

  delta-ms-threshold:
    type: int
    default: 0
    description: Max time in ms before rotating to a new file. 0 = disabled.

  size-threshold:
    type: int
    default: 0
    description: Max bytes per file before rotating. 0 = disabled.
