description: |
  UART sink node. Writes received buffer data to a UART device
  using poll_out.

compatible: "zstreamer,zstsink-uart"

include: zstreamer,zstsink.yaml

properties:
  uart-device:
    type: phandle
    required: true
    description: Phandle to the UART device to write to.
