description: |
  UART source node. Reads bytes from a UART device using poll_in
  and submits them as buffers to downstream children.

compatible: "zstreamer,src-uart"

include: zstreamer,src.yaml

properties:
  uart-device:
    type: phandle
    required: true
    description: Phandle to the UART device to read from.
