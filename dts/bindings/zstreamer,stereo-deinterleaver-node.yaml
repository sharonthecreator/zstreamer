description: |
  16-bit stereo deinterleaver processor node for zstreamer.

  The node treats each input buffer as interleaved 16-bit stereo samples and
  emits separate left and right buffers. An input laid out as L0, R0, L1, R1
  becomes an L0, L1 buffer sent to left-children and an R0, R1 buffer sent to
  right-children. Sample signedness and byte order are preserved.

    stereo-deinterleaver {
      compatible = "zstreamer,stereo-deinterleaver-node";
      left-children = <&left_sink>;
      right-children = <&right_sink>;
    };

  Buffers that do not contain a whole number of stereo frames are dropped.
  The node holds the input while allocating both output buffers, so the graph's
  buffer-count must be greater than two, in addition to any buffers needed
  elsewhere in the pipeline.

compatible: "zstreamer,stereo-deinterleaver-node"

include:
  - name: zstreamer,node.yaml
    property-blocklist:
      - children

properties:
  left-children:
    type: phandles
    required: true
    description: Downstream node(s) that receive the left-channel buffers.

  right-children:
    type: phandles
    required: true
    description: Downstream node(s) that receive the right-channel buffers.
