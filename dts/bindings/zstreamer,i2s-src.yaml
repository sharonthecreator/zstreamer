description: |
  I2S source node for zstreamer pipeline.

  Captures audio samples from an I2S microphone using Zephyr's
  I2S API.  The driver operates as a bit-clock / frame-clock slave,
  expecting the codec or mic to provide clocking.

  Example for a mono 16-bit mic at 16 kHz:

    i2s_source: i2s-source {
        compatible = "zstreamer,i2s-src";
        i2s-device = <&i2s1>;
        sample-rate-hz = <16000>;
        word-size = <16>;
        block-size = <512>;
        children = <&some_sink>;
        autostart;
    };

compatible: "zstreamer,i2s-src"

include: zstreamer,src.yaml

properties:
  i2s-device:
    type: phandle
    required: true
    description: |
      Phandle to the I2S controller device node used for RX.

  sample-rate-hz:
    type: int
    required: true
    description: |
      Audio sample rate in Hz (e.g. 16000, 44100, 48000).

  word-size:
    type: int
    default: 16
    description: |
      Sample word size in bits (e.g. 16, 24, 32).

  num-channels:
    type: int
    default: 1
    description: |
      Number of audio channels (1 for mono, 2 for stereo).

  block-size:
    type: int
    default: 512
    description: |
      Size in bytes of each I2S RX block.  Larger values reduce
      interrupt overhead but increase latency.
