description: |
  Number generator source node. Produces sequential bytes 0-255
  (wrapping) to fill each buffer completely. Software-only test node.

compatible: "zstreamer,numgen-src"

include: zstreamer,src.yaml

properties:
  sleep-ms:
    type: int
    default: 1
    description: |
      Milliseconds to sleep after filling each buffer. Controls the
      production rate and allows simulated time to advance on native_sim.
