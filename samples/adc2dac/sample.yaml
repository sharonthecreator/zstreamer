sample:
  name: ADC-to-DAC
  description: |
    Captures dual-channel ADC data and outputs it to a dual-channel
    DAC using a zstreamer graph with adc-src and dac-sink nodes.
    Demonstrates multi-channel ADC capture routed to multi-channel
    DAC output.
tests:
  sample.zstreamer.adc2dac:
    tags: zstreamer adc dac
    platform_allow: nucleo_u575zi_q
