sample:
  name: ADC-to-FakeSink
  description: |
    Captures ADC samples using timer-triggered DMA and discards them
    using a zstreamer graph with src-adc and sink-fake nodes.
    Demonstrates audio/signal capture at precise sample rates.
tests:
  sample.zstreamer.adc2fakesink:
    tags: zstreamer adc
    platform_allow: nucleo_u575zi_q
