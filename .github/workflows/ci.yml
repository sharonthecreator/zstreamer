# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: Clang Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: pip install clang-format==21.1.8

      - name: Version clang-format
        run: clang-format --version

      - name: Check formatting
        run: |
          find drivers/ subsys/ include/ tests/ -name '*.c' -o -name '*.h' \
            | xargs clang-format --dry-run --Werror

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint==1.38.0

      - name: Version yamlint
        run: yamllint --version

      - name: Check YAML
        run: |
          find . -name '*.yml' -o -name '*.yaml' \
            | grep -v -e twister-out -e build \
            | xargs yamllint -s

  gitlint:
    name: Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitlint
        run: pip install gitlint==0.19.1

      - name: Version gitlint
        run: gitlint --version

      - name: Check commit messages (PR)
        if: github.event_name == 'pull_request'
        run: |
          gitlint --commits origin/${{ github.base_ref }}..${{ github.sha }}

      - name: Check commit messages (push)
        if: github.event_name == 'push'
        run: |
          gitlint --commits ${{ github.event.before }}..${{ github.event.after }}

  twister-tests:
    name: Twister Tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.28.7
    steps:
      - uses: actions/checkout@v4

      - name: West init and update
        run: |
          west init -l .
          west update --narrow --fetch-opt=--depth=1

      - name: Run tests
        run: |
          west twister -T tests \
            -p native_sim \
            --inline-logs \
            --integration

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twister-results
          path: twister-out/twister.xml

  sample-builds:
    name: Sample Builds
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.28.7
    steps:
      - uses: actions/checkout@v4

      - name: West init and update
        run: |
          west init -l .
          west update --narrow --fetch-opt=--depth=1

      - name: Build samples (native_sim)
        run: |
          west twister -T samples \
            -p native_sim \
            --build-only \
            --inline-logs \
            --integration

      - name: Build samples (hardware targets, compile-only)
        run: |
          west build -b nucleo_u575zi_q \
            samples/adc2dac -p auto -d build/adc2dac
          west build -b nucleo_l432kc \
            samples/sine2pwm -p auto -d build/sine2pwm
          west build -b nucleo_wl55jc \
            samples/sine2lora -p auto -d build/sine2lora
          west build -b nucleo_wl55jc \
            samples/lora2pwm -p auto -d build/lora2pwm
